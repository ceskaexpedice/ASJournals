<div class="app-fxLayout app-row app-center-v app-mb-4 app-mobile-row app-form-field"  *ngFor="let criterium of criteria; let last=last; let idx = index">
  <!-- <mat-label class="app-text-cutter">{{ 'q_placeholder' | translate }}</mat-label> -->

  
  <button mat-stroked-button color="primary" matPrefix [matMenuTriggerFor]="menuPrefix" class="app-ml-4 app-mr-4">
    {{ "fields." + criterium.field | translate  }}<mat-icon iconPositionEnd>expand_more</mat-icon>
  </button>
  <mat-menu #menuPrefix="matMenu">
    <button mat-menu-item *ngFor="let field of fields" (click)="setField(criterium, field)">{{ "fields." + field.field | translate }}</button>
  </mat-menu>

  <ng-container *ngIf="criterium.field === 'genre'">
    <mat-select  (selectionChange)="search()" name="vydavatel" [(ngModel)]="criterium.value" 
      style="width: 200px; ">
      <mat-option *ngFor="let genre of state.genres" [value]="genre.val">
        {{'genre.'+genre.val | translate }} 
      </mat-option>
    </mat-select>
  </ng-container>
  <ng-container *ngIf="criterium.field !== 'genre'">
    <mat-form-field appearance="outline">
    <input matInput type="text" #input 
    [(ngModel)]="criterium.value" name="cvalue" (keyup.enter)="search()" [placeholder]="'q_placeholder' | translate" 
    class="app-text-cutter"></mat-form-field>
  </ng-container>

  <div matSuffix class="app-fxLayout app-row app-center-v app-mr-4" style="margin-left:auto;">
    <button mat-stroked-button color="primary" [matMenuTriggerFor]="menuSufix" class="app-ml-4 app-mr-4">
      {{ criterium.operatorLabel | translate  }}<mat-icon iconPositionEnd>expand_more</mat-icon>
    </button>
    <mat-menu #menuSufix="matMenu">
      <button mat-menu-item *ngFor="let operator of operators" (click)="setOperator(criterium, operator)">{{ operator.label | translate }}</button>
    </mat-menu>
    <a [matTooltip]="'button.cancelFilter' | translate" (click)="removeCriterium(idx)">
      <mat-icon color="primary">cancel</mat-icon>
    </a>
  </div>
</div>

<div class="app-fxLayout app-row app-center-v app-mb-4 app-mobile-row">
  <div class="app-fxFlex app-left">
    <button mat-stroked-button color="primary" class="app-mr-2" (click)="addCriterium()"><mat-icon>add</mat-icon>{{ 'button.addCriterion' | translate }}</button>
    <button mat-stroked-button color="primary" (click)="reset()"><mat-icon>delete_forever</mat-icon>{{'button.deleteForm' | translate }}</button>
  </div>
  <button class="app-right" mat-flat-button color="primary" (click)="search()"><mat-icon>search</mat-icon>{{ 'button.search' | translate }}</button>
</div>
