<div class="app-p-4 app-text-content">
  
  <app-article-info [article]="state.viewerArticle" [journal]="state.viewerJournal"></app-article-info>

  <h2 class="app-headline app-mt-4">{{ 'desc.citation' | translate }} 
    <mat-select (selectionChange)="getCitace()" appearance="outline" name="exp" 
      [(ngModel)]="exp" style="width: 20%; display: inline-block; border: 1px solid #ccc; padding: 5px;">
        <mat-option [value]="'iso690'">ISO 690</mat-option>
        <mat-option [value]="'mla'">MLA</mat-option>
        <mat-option [value]="'bibtex'">BibTeX</mat-option>
        <mat-option [value]="'ris'">RIS</mat-option>
      </mat-select></h2>
  <p [innerHtml]="citace"></p>
  
  <p>
    {{ 'desc.availableAlsoFrom' | translate }}:<br />
    <a [href]="location" target="_blank">{{ location }}</a>
  </p>
  
  <h2 *ngIf="state.viewerArticle?.hasReferences" class="app-headline app-mt-4">{{ 'references' | translate }}</h2>
  <p *ngIf="state.viewerArticle?.hasReferences">
    <ng-container *ngFor="let ref of state.viewerArticle.references">
      <div [innerHTML]="ref"></div>
    </ng-container>
  </p>
</div>
